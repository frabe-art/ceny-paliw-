<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Cena Paliwa</title>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Cena Paliwa"/>
  <meta name="theme-color" content="#9b1a1a"/>
  <link rel="manifest" href="/manifest.json"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Arial Narrow', Arial, sans-serif;
      padding: 20px;
    }

    #app { width: 100%; max-width: 420px; }

    .pole-top {
      background: linear-gradient(180deg, #7b1010 0%, #9b1a1a 100%);
      border-radius: 16px 16px 0 0;
      padding: 16px 20px;
      text-align: center;
      border-bottom: 3px solid #3a0808;
    }
    .pole-title {
      color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }

    .tabs { display: flex; background: #2a0a0a; }
    .tab {
      flex: 1; padding: 10px 0;
      background: transparent; border: none;
      color: rgba(255,255,255,0.35);
      font-family: inherit; font-size: 13px; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer;
      border-bottom: 3px solid transparent; transition: all .2s;
    }
    .tab.active { background: #c62828; color: #fff; border-bottom-color: #ff5252; }

    .led-panel {
      background: #111;
      border: 3px solid #2a2a2a;
      border-top: none;
    }

    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 14px; background: #0a0a0a; border-bottom: 1px solid #222;
    }
    .status-left { display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #444; display: inline-block; transition: all .3s; }
    .dot.live    { background: #00e676; box-shadow: 0 0 6px #00e676; }
    .dot.loading { background: #ffa726; box-shadow: 0 0 6px #ffa726; animation: pulse 1s infinite; }
    .dot.error   { background: #ef5350; }
    .status-text { color: #666; font-size: 10px; letter-spacing: 0.5px; }
    .btn-refresh {
      background: transparent; border: 1px solid #333; color: #666;
      border-radius: 5px; padding: 3px 10px; font-size: 10px;
      cursor: pointer; font-family: inherit; transition: all .2s;
    }
    .btn-refresh:disabled { color: #2a2a2a; cursor: not-allowed; }

    .fuel-rows { padding: 6px 0; }
    .fuel-row {
      display: flex; align-items: stretch;
      border-bottom: 1px solid #1e1e1e; min-height: 80px;
      position: relative; overflow: hidden;
    }
    .fuel-row:last-child { border-bottom: none; }

    .fuel-tag {
      width: 80px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-right: 3px solid #000;
      font-size: 26px; font-weight: 900;
      font-family: 'Arial Black', sans-serif; letter-spacing: 1px;
    }

    .fuel-price-area {
      flex: 1; display: flex; align-items: center;
      justify-content: flex-end; padding-right: 18px;
      background: #0d0d0d; position: relative;
    }

    .led-number {
      font-size: 52px; font-weight: 900; line-height: 1;
      font-family: 'Courier New', monospace;
      color: #2a0000; letter-spacing: 3px; transition: color .4s, text-shadow .4s;
    }
    .led-number.on {
      color: #ff2222;
      text-shadow: 0 0 12px rgba(255,34,34,.6), 0 0 30px rgba(255,0,0,.3);
    }
    .led-unit {
      font-size: 13px; color: #882222; font-weight: 700;
      margin-left: 6px; align-self: flex-end; padding-bottom: 10px;
    }

    .shimmer::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,60,60,.05), transparent);
      animation: shimmer 1.4s infinite;
    }

    .panel-footer {
      padding: 9px 14px; background: #0a0a0a;
      border-top: 1px solid #1e1e1e; text-align: center;
      color: #333; font-size: 10px; letter-spacing: 1px;
    }

    .pole-bottom {
      background: linear-gradient(180deg, #9b1a1a 0%, #7b1010 100%);
      border-radius: 0 0 16px 16px; height: 12px;
    }

    #install-banner {
      margin-top: 14px;
      background: rgba(155,26,26,.2);
      border: 1px solid rgba(255,82,82,.25);
      border-radius: 12px; padding: 10px 16px;
      display: none; align-items: center; justify-content: space-between; gap: 10px;
    }
    #install-banner span { color: rgba(255,255,255,.65); font-size: 12px; }
    #btn-install {
      background: #c62828; color: #fff; border: none;
      border-radius: 8px; padding: 6px 14px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      font-family: inherit; white-space: nowrap;
    }

    @keyframes shimmer { 0%{transform:translateX(-100%)} 100%{transform:translateX(300%)} }
    @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
<div id="app">
  <div class="pole-top">
    <div class="pole-title"><span>⛽</span> Cena Paliwa</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-today"    onclick="switchTab('today')">📅 Dziś</button>
    <button class="tab"        id="tab-tomorrow" onclick="switchTab('tomorrow')">🔮 Jutro</button>
  </div>

  <div class="led-panel">
    <div class="status-bar">
      <div class="status-left">
        <span class="dot" id="dot"></span>
        <span class="status-text" id="status-text">Wczytuję…</span>
      </div>
      <button class="btn-refresh" id="btn-refresh" onclick="loadPrices(true)">🔄 Odśwież</button>
    </div>

    <div class="fuel-rows">
      <div class="fuel-row">
        <div class="fuel-tag" style="background:#2e7d32;color:#fff;">95</div>
        <div class="fuel-price-area" id="area-95">
          <span class="led-number" id="price-95">-.--</span>
          <span class="led-unit">zł/l</span>
        </div>
      </div>
      <div class="fuel-row">
        <div class="fuel-tag" style="background:#1a237e;color:#fff;">98</div>
        <div class="fuel-price-area" id="area-98">
          <span class="led-number" id="price-98">-.--</span>
          <span class="led-unit">zł/l</span>
        </div>
      </div>
      <div class="fuel-row">
        <div class="fuel-tag" style="background:#111;color:#fff;border-right-color:#333;">ON</div>
        <div class="fuel-price-area" id="area-on">
          <span class="led-number" id="price-on">-.--</span>
          <span class="led-unit">zł/l</span>
        </div>
      </div>
    </div>

    <div class="panel-footer" id="footer">📅 wczytuję…</div>
  </div>

  <div class="pole-bottom"></div>

  <div id="install-banner">
    <span>📲 Zainstaluj jako aplikację</span>
    <button id="btn-install">Zainstaluj</button>
  </div>
</div>

<script>
  // ── Konfiguracja ─────────────────────────────────────────────────────────
  // ZMIEŃ na swój URL po wdrożeniu na Vercel:
  const API_BASE = window.location.origin;

  // Dane cache + fallback
  const fallback = {
    today:    { pb95: "6.46", pb98: "6.96", diesel: "7.31", date: "01.05.2026" },
    tomorrow: { pb95: null,   pb98: null,   diesel: null,   date: null },
  };
  let store   = { today: { ...fallback.today }, tomorrow: { ...fallback.tomorrow } };
  let curTab  = "today";
  let loading = false;

  // ── UI ───────────────────────────────────────────────────────────────────
  function setDot(cls, txt) {
    document.getElementById("dot").className = "dot " + (cls || "");
    document.getElementById("status-text").textContent = txt;
  }
  function setLoading(on) {
    loading = on;
    document.getElementById("btn-refresh").disabled = on;
    document.getElementById("btn-refresh").textContent = on ? "⏳" : "🔄 Odśwież";
    ["95","98","on"].forEach(k => {
      document.getElementById("area-"+k).classList.toggle("shimmer", on);
    });
    if (on) setDot("loading", "Pobieranie danych…");
  }
  function render() {
    const d = store[curTab];
    const map = { "95": d.pb95, "98": d.pb98, "on": d.diesel };
    for (const [k, v] of Object.entries(map)) {
      const el = document.getElementById("price-"+k);
      el.textContent = v ?? "-.--";
      el.classList.toggle("on", !!v);
    }
    const footer = document.getElementById("footer");
    if (curTab === "tomorrow") {
      footer.textContent = d.date ? "🔮 Jutro · " + d.date : "🔮 Prognoza na jutro";
    } else {
      footer.textContent = d.date ? "📅 " + d.date : "📅 wczytuję…";
    }
  }

  function switchTab(tab) {
    curTab = tab;
    document.getElementById("tab-today").classList.toggle("active", tab === "today");
    document.getElementById("tab-tomorrow").classList.toggle("active", tab === "tomorrow");
    render();
    // Załaduj jutro przy pierwszym kliknięciu
    if (tab === "tomorrow" && !store.tomorrow.pb95) loadPrices(false, "tomorrow");
  }

  // ── Fetch ─────────────────────────────────────────────────────────────────
  async function loadPrices(force, tab) {
    const t = tab || curTab;
    setLoading(true);
    try {
      const url = `${API_BASE}/api/ceny?day=${t === "tomorrow" ? "tomorrow" : "today"}&v=${force ? Date.now() : ""}`;
      const res  = await fetch(url, { cache: force ? "no-store" : "default" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      store[t] = {
        pb95:   data.prices?.pb95   || store[t].pb95,
        pb98:   data.prices?.pb98   || store[t].pb98,
        diesel: data.prices?.diesel || store[t].diesel,
        date:   data.date || store[t].date,
      };
      const time = new Date().toLocaleTimeString("pl-PL", {hour:"2-digit",minute:"2-digit"});
      setDot("live", "Zaktualizowano o " + time);
    } catch(e) {
      setDot("error", "Błąd · dane przybliżone");
    }
    setLoading(false);
    render();
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  render();
  loadPrices(false);

  // ── PWA install ───────────────────────────────────────────────────────────
  let deferredPrompt;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferredPrompt = e;
    const b = document.getElementById("install-banner");
    b.style.display = "flex";
  });
  document.getElementById("btn-install").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === "accepted") document.getElementById("install-banner").style.display = "none";
    deferredPrompt = null;
  });

  // ── Service Worker ────────────────────────────────────────────────────────
  if ("serviceWorker" in navigator) {
    const sw = `
      const CACHE='paliwo-v2';
      self.addEventListener('install',()=>self.skipWaiting());
      self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
      self.addEventListener('fetch',e=>{
        if(e.request.url.includes('/api/')) return;
        e.respondWith(
          caches.open(CACHE).then(c=>
            c.match(e.request).then(r=>r||(fetch(e.request).then(f=>{c.put(e.request,f.clone());return f;})))
          )
        );
      });
    `;
    const blob = new Blob([sw], {type:"application/javascript"});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }
</script>
</body>
</html>
